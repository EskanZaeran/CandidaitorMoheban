<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرم کاندیداتوری</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 200% 200%;
    animation: gradientMove 12s ease infinite;
    padding: 20px;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 460px;
    border-radius: 24px;
    padding: 36px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    position: relative;
    overflow: hidden;
    animation: popIn .5s cubic-bezier(.26,1.36,.5,1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  h1 {
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
    color: #333;
  }

  .subtitle {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin-bottom: 26px;
  }

  .progress {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 26px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #e0e0e0;
    transition: all .35s;
  }

  .dot.active {
    background: linear-gradient(135deg, #667eea, #764ba2);
    width: 28px;
    border-radius: 6px;
  }

  .step { display: none; animation: fadeSlide .4s ease; }
  .step.active { display: block; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(15px); }
    to { opacity: 1; transform: translateX(0); }
  }

  label {
    display: block;
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
    font-weight: 600;
  }

  input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #eee;
    border-radius: 14px;
    font-size: 15px;
    margin-bottom: 20px;
    transition: border-color .25s, box-shadow .25s;
    outline: none;
  }

  input[type="text"]:focus {
    border-color: #764ba2;
    box-shadow: 0 0 0 4px rgba(118,75,162,0.12);
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }

  .option {
    position: relative;
  }

  .option input { display: none; }

  .option label.chip {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border: 2px solid #eee;
    border-radius: 14px;
    cursor: pointer;
    font-weight: 500;
    color: #444;
    transition: all .25s;
    font-size: 15px;
  }

  .option label.chip .box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid #ccc;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
  }

  .option label.chip .box svg {
    width: 12px;
    height: 12px;
    opacity: 0;
    transform: scale(.5);
    transition: all .2s;
  }

  .option input:checked + label.chip {
    border-color: #764ba2;
    background: linear-gradient(135deg, rgba(102,126,234,.08), rgba(118,75,162,.08));
    transform: translateY(-2px);
  }

  .option input:checked + label.chip .box {
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-color: transparent;
  }

  .option input:checked + label.chip .box svg { opacity: 1; transform: scale(1); }

  .emoji { font-size: 18px; }

  .btn-row { display: flex; gap: 10px; margin-top: 10px; }

  button {
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex: 1;
    font-family: inherit;
    transition: transform .15s, box-shadow .15s;
  }

  button:active { transform: scale(.96); }

  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 10px 25px rgba(118,75,162,0.35);
  }

  .btn-secondary {
    background: #f2f2f5;
    color: #555;
  }

  .error {
    color: #e0245e;
    font-size: 13px;
    margin: -14px 0 16px;
    display: none;
  }

  .summary-box {
    background: #faf9fc;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 24px;
  }

  .summary-box p { font-size: 14px; color: #666; margin-bottom: 10px; }
  .summary-box p b { color: #333; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }

  .tag {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
  }

  /* Success step */
  .success-wrap { text-align: center; padding: 10px 0; }

  .checkmark-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    animation: bounceIn .5s cubic-bezier(.26,1.36,.5,1);
  }

  @keyframes bounceIn {
    0% { transform: scale(0); }
    60% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .checkmark-circle svg {
    width: 40px;
    height: 40px;
    stroke: #fff;
    stroke-width: 3;
    fill: none;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: draw .4s .3s forwards ease;
  }

  @keyframes draw { to { stroke-dashoffset: 0; } }

  .success-wrap h2 { font-size: 19px; color: #333; margin-bottom: 8px; }
  .success-wrap p { color: #888; font-size: 14px; }

  .loader {
    width: 18px;
    height: 18px;
    border: 3px solid rgba(255,255,255,.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-left: 8px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <h1>فرم کاندیداتوری</h1>
  <p class="subtitle">برای عضویت در تیم، فرم زیر رو کامل کن</p>

  <div class="progress">
    <div class="dot active" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <!-- Step 1: Form -->
  <div class="step active" id="step1">
    <label for="fullname">نام و نام خانوادگی</label>
    <input type="text" id="fullname" placeholder="مثلا امین رضاصفت">
    <p class="error" id="nameError">لطفاً نام و نام خانوادگی رو وارد کن</p>

    <label>حوزه مسئولیت (می‌تونی چند مورد انتخاب کنی)</label>
    <div class="options" id="optionsList">
      <div class="option">
        <input type="checkbox" id="opt1" value="رسانه">
        <label class="chip" for="opt1"><span class="emoji">📷</span> رسانه
          <span class="box" style="margin-right:auto;"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </label>
      </div>
      <div class="option">
        <input type="checkbox" id="opt2" value="آشپزخانه">
        <label class="chip" for="opt2"><span class="emoji">🍳</span> آشپزخانه
          <span class="box" style="margin-right:auto;"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </label>
      </div>
      <div class="option">
        <input type="checkbox" id="opt3" value="فضاسازی">
        <label class="chip" for="opt3"><span class="emoji">🎨</span> فضاسازی
          <span class="box" style="margin-right:auto;"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </label>
      </div>
      <div class="option">
        <input type="checkbox" id="opt4" value="علمی">
        <label class="chip" for="opt4"><span class="emoji">🔬</span> علمی
          <span class="box" style="margin-right:auto;"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </label>
      </div>
      <div class="option">
        <input type="checkbox" id="opt5" value="اجرایی">
        <label class="chip" for="opt5"><span class="emoji">⚙️</span> اجرایی
          <span class="box" style="margin-right:auto;"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </label>
      </div>
    </div>
    <p class="error" id="optError">حداقل یک حوزه مسئولیت رو انتخاب کن</p>

    <div class="btn-row">
      <button class="btn-primary" onclick="goToSummary()">مرحله بعد</button>
    </div>
  </div>

  <!-- Step 2: Summary -->
  <div class="step" id="step2">
    <div class="summary-box">
      <p>👤 اسم شما: <b id="sumName"></b></p>
      <p>حوزه‌های انتخابی شما:</p>
      <div class="tags" id="sumTags"></div>
    </div>
    <div class="btn-row">
      <button class="btn-secondary" onclick="goBack()">قبلی</button>
      <button class="btn-primary" id="submitBtn" onclick="submitForm()">ثبت نهایی</button>
    </div>
  </div>

  <!-- Step 3: Success -->
  <div class="step" id="step3">
    <div class="success-wrap">
      <div class="checkmark-circle">
        <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>
      </div>
      <h2>ثبت‌نام با موفقیت انجام شد 🎉</h2>
      <p>منتظر اطلاع‌رسانی‌های بعدی باش</p>
    </div>
  </div>
</div>

<script>
  // ⚠️ آدرس گوگل اسکریپت خودت رو اینجا جایگزین کن (بعد از Deploy گرفتنش)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby0N1WnaFsS4PH6olmceMIzDdeIBMFFBUgPzs30whL8vh3nW5sRz5hgUhnlhkJFgxnu/exec";

  function setDot(step) {
    document.getElementById('dot1').classList.toggle('active', step >= 1);
    document.getElementById('dot2').classList.toggle('active', step >= 2);
    document.getElementById('dot3').classList.toggle('active', step >= 3);
  }

  function goToSummary() {
    const name = document.getElementById('fullname').value.trim();
    const checked = Array.from(document.querySelectorAll('#optionsList input:checked')).map(c => c.value);

    document.getElementById('nameError').style.display = name ? 'none' : 'block';
    document.getElementById('optError').style.display = checked.length ? 'none' : 'block';

    if (!name || checked.length === 0) return;

    document.getElementById('sumName').textContent = name;
    const tagsWrap = document.getElementById('sumTags');
    tagsWrap.innerHTML = '';
    checked.forEach(v => {
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = v;
      tagsWrap.appendChild(t);
    });

    document.getElementById('step1').classList.remove('active');
    document.getElementById('step2').classList.add('active');
    setDot(2);
  }

  function goBack() {
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
    setDot(1);
  }

  function submitForm() {
  const name = document.getElementById('fullname').value.trim();
  const checked = Array.from(document.querySelectorAll('#optionsList input:checked')).map(c => c.value);

  const btn = document.getElementById('submitBtn');
  btn.innerHTML = 'در حال ثبت... <span class="loader"></span>';
  btn.disabled = true;

  const callbackName = 'jsonpCallback_' + Date.now();

  window[callbackName] = function(response) {
    document.body.removeChild(script);
    delete window[callbackName];

    if (response.status === 'success') {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step3').classList.add('active');
      setDot(3);
    } else {
      btn.innerHTML = 'ثبت نهایی';
      btn.disabled = false;
      alert('مشکلی پیش اومد، دوباره امتحان کن. (' + (response.message || '') + ')');
    }
  };

  const params = new URLSearchParams({
    fullname: name,
    responsibilities: checked.join(', '),
    callback: callbackName
  });

  const script = document.createElement('script');
  script.src = SCRIPT_URL + '?' + params.toString();
  script.onerror = function() {
    document.body.removeChild(script);
    delete window[callbackName];
    btn.innerHTML = 'ثبت نهایی';
    btn.disabled = false;
    alert('اتصال به سرور برقرار نشد، دوباره امتحان کن.');
  };
  document.body.appendChild(script);
}
</script>

</body>
</html>
